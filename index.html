<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="D7 Route - Plan smarter routes, save time, and reduce fuel costs."
  >

  <title>D7 Route</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #111111;
      --dark-gray: #292929;
      --gray: #6b6b6b;
      --light-gray: #eeeeee;
      --background: #f5f5f5;
      --white: #ffffff;
      --red: #c9202f;
      --dark-red: #a31824;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(rgba(18, 18, 18, 0.62), rgba(18, 18, 18, 0.62)), url("d7-forest-road-background.jpg") center / cover fixed;
      color: var(--black);
    }

    .top-bar {
      height: 7px;
      background: var(--red);
    }

    .app {
      width: min(100% - 32px, 720px);
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    .header {
      margin-bottom: 28px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--red);
      color: var(--white);
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(201, 32, 47, 0.2);
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1;
      letter-spacing: -1px;
      color: var(--black);
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--gray);
      font-size: 16px;
    }

    .card {
      padding: 28px;
      border: 1px solid #dddddd;
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .section-title {
      margin: 0 0 6px;
      font-size: 20px;
      color: var(--black);
    }

    .section-description {
      margin: 0 0 22px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark-gray);
      font-size: 14px;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 14px 15px;
      border: 1px solid #cfcfcf;
      border-radius: 9px;
      background: var(--white);
      color: var(--black);
      font-size: 16px;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(201, 32, 47, 0.12);
    }

    input::placeholder {
      color: #999999;
    }

    button {
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    .add-button {
      flex: 0 0 auto;
      padding: 0 20px;
      background: var(--black);
      color: var(--white);
    }

    .add-button:hover {
      background: var(--dark-gray);
    }

    .stop-counter {
      margin: 10px 0 0;
      color: var(--gray);
      font-size: 13px;
    }

    .stops-container {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .stop-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #e1e1e1;
      border-radius: 9px;
      background: #fafafa;
    }

    .stop-number {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--dark-gray);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
    }

    .stop-address {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--dark-gray);
      font-size: 14px;
    }

    .remove-button {
      flex: 0 0 auto;
      padding: 7px 10px;
      background: transparent;
      color: var(--red);
      font-size: 13px;
    }

    .remove-button:hover {
      background: #fff0f1;
    }

    .divider {
      height: 1px;
      margin: 26px 0;
      background: var(--light-gray);
    }

    .destination-wrapper {
      position: relative;
    }

    .destination-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .destination-badge {
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff0f1;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 26px;
    }

    .action-button {
      min-height: 50px;
      padding: 13px 18px;
    }

    #map {
      width: 100%;
      height: 400px;
      margin-top: 24px;
      border-radius: 18px;
      overflow: hidden;
      background: #d9d9d9;
    }

    .optimize-button {
      border: 1px solid var(--black);
      background: var(--white);
      color: var(--black);
    }

    .optimize-button:hover {
      background: var(--light-gray);
    }

    .calculate-button {
      background: var(--red);
      color: var(--white);
    }

    .calculate-button:hover {
      background: var(--dark-red);
    }

    .route-message {
      min-height: 22px;
      margin: 18px 0 0;
      color: var(--dark-gray);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .footer-note {
      margin: 18px 0 0;
      color: #888888;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .app {
        width: min(100% - 22px, 720px);
        padding-top: 28px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 32px;
      }

      .input-row {
        flex-direction: column;
      }

      .add-button {
        min-height: 48px;
        width: 100%;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="top-bar"></div>

  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="logo-mark">D7</div>
        <h1>D7 Route</h1>
      </div>

      <p class="subtitle">
        Plan smarter routes. Save time and fuel.
      </p>
    </header>

    <section class="card">
      <h2 class="section-title">Build Your Route</h2>

      <p class="section-description">
        Add up to 20 stops, then enter your final destination.
      </p>

      <label for="stop-input">Add a stop</label>

      <div class="input-row">
        <input
          id="stop-input"
          type="text"
          placeholder="Enter an address"
          autocomplete="street-address"
        >

        <button
          id="add-stop"
          class="add-button"
          type="button"
        >
          + Add Stop
        </button>
      </div>

      <p
        id="stop-counter"
        class="stop-counter"
        aria-live="polite"
      >
        0 of 20 stops added
      </p>

      <div
        id="stops-container"
        class="stops-container"
        aria-live="polite"
      ></div>

      <div class="divider"></div>

      <div class="destination-wrapper">
        <div class="destination-label-row">
          <label for="destination">Destination</label>
          <span class="destination-badge">Final Stop</span>
        </div>

        <input
          id="destination"
          type="text"
          placeholder="Enter final destination"
          autocomplete="street-address"
        >
      </div>

      <div class="actions">
        <button
          id="optimize-route"
          class="action-button optimize-button"
          type="button"
        >
          Optimize Route
        </button>

        <button
          id="calculate-route"
          class="action-button calculate-button"
          type="button"
        >
          Calculate Route
        </button>
      </div>

      <p
        id="route-message"
        class="route-message"
        aria-live="polite"
      ></p>
      <div id="map"></div>
    </section>

    <p class="footer-note">
      D7 Route • Route planning made simple
    </p>
  </main>

  <script>
    const MAX_STOPS = 20;
    let map;
    let directionsService;
    let directionsRenderer;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 38.5816, lng: -121.4944 },
        zoom: 10,
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer();
      directionsRenderer.setMap(map);
    }


    const stops = [];

    const stopInput = document.getElementById("stop-input");
    const addStopButton = document.getElementById("add-stop");
    const stopsContainer = document.getElementById("stops-container");
    const stopCounter = document.getElementById("stop-counter");
    const destinationInput = document.getElementById("destination");
    const optimizeButton = document.getElementById("optimize-route");
    const calculateButton = document.getElementById("calculate-route");
    const routeMessage = document.getElementById("route-message");

    function updateStopCounter() {
      stopCounter.textContent =
        `${stops.length} of ${MAX_STOPS} stops added`;

      const limitReached = stops.length >= MAX_STOPS;

      addStopButton.disabled = limitReached;
      stopInput.disabled = limitReached;

      if (limitReached) {
        stopInput.placeholder = "Maximum of 20 stops reached";
      } else {
        stopInput.placeholder = "Enter an address";
      }
    }

    function renderStops() {
      stopsContainer.innerHTML = "";

      stops.forEach((address, index) => {
        const stopItem = document.createElement("div");
        stopItem.className = "stop-item";

        const stopNumber = document.createElement("span");
        stopNumber.className = "stop-number";
        stopNumber.textContent = index + 1;

        const stopAddress = document.createElement("span");
        stopAddress.className = "stop-address";
        stopAddress.textContent = address;

        const removeButton = document.createElement("button");
        removeButton.className = "remove-button";
        removeButton.type = "button";
        removeButton.textContent = "Remove";

        removeButton.addEventListener("click", () => {
          stops.splice(index, 1);
          renderStops();
          routeMessage.textContent = "";
        });

        stopItem.appendChild(stopNumber);
        stopItem.appendChild(stopAddress);
        stopItem.appendChild(removeButton);

        stopsContainer.appendChild(stopItem);
      });

      updateStopCounter();
    }

    function addStop() {
      const address = stopInput.value.trim();

      if (!address) {
        routeMessage.textContent =
          "Enter an address before adding a stop.";
        stopInput.focus();
        return;
      }

      if (stops.length >= MAX_STOPS) {
        routeMessage.textContent =
          "You have reached the 20-stop limit.";
        return;
      }

      stops.push(address);

      stopInput.value = "";
      routeMessage.textContent = "";

      renderStops();

      stopInput.focus();
    }

    addStopButton.addEventListener("click", addStop);

    stopInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addStop();
      }
    });

    optimizeButton.addEventListener("click", () => {
      if (stops.length < 2) {
        routeMessage.textContent =
          "Add at least two stops before optimizing.";
        return;
      }

      if (!destinationInput.value.trim()) {
        routeMessage.textContent =
          "Enter your final destination before optimizing.";
        destinationInput.focus();
        return;
      }

      routeMessage.textContent =
        "Route optimization will be connected next.";
    });

    calculateButton.addEventListener("click", () => {
  const destination = destinationInput.value.trim();

  if (stops.length < 1) {
    routeMessage.textContent =
      "Add at least one stop before calculating a route.";
    return;
  }

  if (!destination) {
    routeMessage.textContent =
      "Enter your final destination.";
    destinationInput.focus();
    return;
  }

  const origin = stops[0];

  const waypoints = stops.slice(1).map((address) => ({
    location: address,
    stopover: true
  }));

  routeMessage.textContent = "Calculating route...";

  directionsService.route(
    {
      origin: origin,
      destination: destination,
      waypoints: waypoints,
      travelMode: google.maps.TravelMode.DRIVING
    },
    (result, status) => {
      if (status === "OK") {
        directionsRenderer.setDirections(result);

        let totalDistance = 0;
        let totalDuration = 0;

        result.routes[0].legs.forEach((leg) => {
          totalDistance += leg.distance.value;
          totalDuration += leg.duration.value;
        });

        const miles = (totalDistance / 1609.344).toFixed(1);
        const minutes = Math.round(totalDuration / 60);

        routeMessage.textContent =
          `Route calculated: ${miles} miles • ${minutes} minutes`;
      } else {
        routeMessage.textContent =
          `Could not calculate route: ${status}`;
      }
    }
  );
});

    updateStopCounter();
  </script>
<script
  async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDlsd2EZo4MxLunslRRMm-Xuy_Y0g6yEYM&libraries=places&callback=initMap">
</script>
</body>
</html>
